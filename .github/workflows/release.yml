name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        shell: bash
        env:
          REGISTRY: ghcr.io/jgaa
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./build-docker-image.sh --push --skip-tests --version "${RELEASE_TAG}" --tag "${RELEASE_TAG}"
          ./build-docker-image.sh --push --skip-tests --version "${RELEASE_TAG}" --tag latest

      - name: Create GitHub Release (alpha)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASENOTES.md
          prerelease: true
