name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Validate CLI artifacts
        shell: bash
        run: |
          cargo check --target x86_64-unknown-linux-musl -p dynip-client --manifest-path cli/Cargo.toml
          cargo check --target x86_64-unknown-linux-musl -p nsblastctl --manifest-path cli/Cargo.toml

      - name: Build CLI release artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p dynip-client --manifest-path cli/Cargo.toml
          cargo build --release --target x86_64-unknown-linux-musl -p nsblastctl --manifest-path cli/Cargo.toml
          mkdir -p dist

          DYNIP_ASSET="nsblast-dynip-${RELEASE_TAG}-linux-x86_64"
          cp cli/target/x86_64-unknown-linux-musl/release/nsblast-dynip "dist/${DYNIP_ASSET}"
          chmod +x "dist/${DYNIP_ASSET}"
          sha256sum "dist/${DYNIP_ASSET}" > "dist/${DYNIP_ASSET}.sha256"

          CTL_ASSET="nsblastctl-${RELEASE_TAG}-linux-x86_64"
          cp cli/target/x86_64-unknown-linux-musl/release/nsblastctl "dist/${CTL_ASSET}"
          chmod +x "dist/${CTL_ASSET}"
          sha256sum "dist/${CTL_ASSET}" > "dist/${CTL_ASSET}.sha256"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        shell: bash
        env:
          REGISTRY: ghcr.io/jgaa
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./build-docker-image.sh --push --skip-tests --version "${RELEASE_TAG}" --tag "${RELEASE_TAG}"
          ./build-docker-image.sh --push --skip-tests --version "${RELEASE_TAG}" --tag latest

      - name: Create GitHub Release (alpha)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASENOTES.md
          prerelease: true
          files: |
            dist/nsblast-dynip-${{ github.ref_name }}-linux-x86_64
            dist/nsblast-dynip-${{ github.ref_name }}-linux-x86_64.sha256
            dist/nsblastctl-${{ github.ref_name }}-linux-x86_64
            dist/nsblastctl-${{ github.ref_name }}-linux-x86_64.sha256
