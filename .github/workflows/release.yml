name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install user manual tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf
          cargo install mdbook --locked

      - name: Validate CLI artifacts
        shell: bash
        run: |
          cargo check -p dynip-client --manifest-path cli/Cargo.toml
          cargo check -p nsblastctl --manifest-path cli/Cargo.toml

      - name: Build CLI release artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo build --release -p dynip-client --manifest-path cli/Cargo.toml
          cargo build --release -p nsblastctl --manifest-path cli/Cargo.toml
          mkdir -p dist

          DYNIP_ASSET="nsblast-dynip-${RELEASE_TAG}-linux-x86_64"
          cp cli/target/release/nsblast-dynip "dist/${DYNIP_ASSET}"
          chmod +x "dist/${DYNIP_ASSET}"
          sha256sum "dist/${DYNIP_ASSET}" > "dist/${DYNIP_ASSET}.sha256"

          CTL_ASSET="nsblastctl-${RELEASE_TAG}-linux-x86_64"
          cp cli/target/release/nsblastctl "dist/${CTL_ASSET}"
          chmod +x "dist/${CTL_ASSET}"
          sha256sum "dist/${CTL_ASSET}" > "dist/${CTL_ASSET}.sha256"

      - name: Build user manual assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mdbook build nsblast-book

          MANUAL_BASENAME="nsblast-user-manual-${RELEASE_TAG}"
          pandoc \
            nsblast-book/book/print.html \
            --from html \
            --to epub \
            --metadata title="The nsBLAST Domain Name Server" \
            --output "dist/${MANUAL_BASENAME}.epub"

          wkhtmltopdf \
            --enable-local-file-access \
            nsblast-book/book/print.html \
            "dist/${MANUAL_BASENAME}.pdf"

          sha256sum "dist/${MANUAL_BASENAME}.epub" > "dist/${MANUAL_BASENAME}.epub.sha256"
          sha256sum "dist/${MANUAL_BASENAME}.pdf" > "dist/${MANUAL_BASENAME}.pdf.sha256"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        shell: bash
        env:
          REGISTRY: ghcr.io/jgaa
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./build-docker-image.sh --push --skip-tests --version "${RELEASE_TAG}" --tag "${RELEASE_TAG}"
          ./build-docker-image.sh --push --skip-tests --version "${RELEASE_TAG}" --tag latest

      - name: Create GitHub Release (alpha)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASENOTES.md
          prerelease: true
          files: |
            dist/nsblast-dynip-${{ github.ref_name }}-linux-x86_64
            dist/nsblast-dynip-${{ github.ref_name }}-linux-x86_64.sha256
            dist/nsblastctl-${{ github.ref_name }}-linux-x86_64
            dist/nsblastctl-${{ github.ref_name }}-linux-x86_64.sha256
            dist/nsblast-user-manual-${{ github.ref_name }}.epub
            dist/nsblast-user-manual-${{ github.ref_name }}.epub.sha256
            dist/nsblast-user-manual-${{ github.ref_name }}.pdf
            dist/nsblast-user-manual-${{ github.ref_name }}.pdf.sha256
