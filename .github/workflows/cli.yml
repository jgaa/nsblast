name: CLI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cli.yml"
      - "cli/**"

permissions:
  contents: read

jobs:
  dynip-client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust format check
        run: cargo fmt --check

      - name: Run tests
        run: cargo test -p dynip-client

      - name: Build release binary
        run: cargo build --release -p dynip-client
