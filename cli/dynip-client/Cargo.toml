[package]
name = "dynip-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nsblast-dynip"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shellexpand = "3.1"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "process", "time"] }
tracing = "0.1"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.23"
