[package]
name = "nsblastctl"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nsblastctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
dirs = "6.0"
keyring = { version = "3.6", default-features = false, features = ["linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.23"
